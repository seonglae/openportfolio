packages:
  - "packages/*"
  - "browser"

# Convex and Vite both shell out to esbuild's platform binary, which only exists
# after its postinstall runs.
allowBuilds:
  # Its postinstall only prints a telemetry notice and writes a "already told
  # you" marker into the user's config dir. Nothing the package needs to work, so
  # it does not get to run. Nothing imports Clerk here any more either: it is an
  # optional peer of `convex` that pnpm installs on its own.
  '@clerk/shared': false
  esbuild: true

# Convex declares @clerk/clerk-react as an optional peer, so pnpm installs it
# even though no file in this repo imports Clerk. The version it picks carries
# an authorization-bypass advisory, and an open alert on dead weight is an alert
# that hides a real one. Pinned forward to the patched line instead.
overrides:
  '@clerk/clerk-react': '^5.61.6'
  # CVE-2026-93749: Tailwind's transitive copy stayed on 1.2.1 after a
  # targeted pnpm update. Keep every source-map-js consumer on the fixed patch.
  source-map-js: '1.2.2'
