name: Openportfolio
options:
  bundleIdPrefix: app.openportfolio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "$(OPENPORTFOLIO_TEAM_ID)"

targets:
  Openportfolio:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: openportfolio
        PRODUCT_BUNDLE_IDENTIFIER: app.openportfolio.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        GENERATE_INFOPLIST_FILE: "YES"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: openportfolio
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Filled from Secrets.xcconfig at build time so a checkout carries no
        # deployment and no key. Both are overridable on the Settings screen.
        OPENPORTFOLIO_CONVEX_URL: "$(OPENPORTFOLIO_CONVEX_URL)"
        OPENPORTFOLIO_SERVICE_KEY: "$(OPENPORTFOLIO_SERVICE_KEY)"
        OPENPORTFOLIO_TENANT_SLUG: "$(OPENPORTFOLIO_TENANT_SLUG)"
