<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>openportfolio demo</title>
    <link rel="icon" type="image/svg+xml" href="/demo/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Before first paint, or a visitor who chose dark gets a white flash and
      // a sun icon for one frame. Light is the default outright rather than
      // following the OS: the marketing page is light, and a dashboard that
      // flips on load reads as a different product than the one linked to.
      try {
        if (localStorage.getItem("openportfolio-theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
        }
      } catch (e) {}
    </script>
    <script type="module" crossorigin src="/demo/assets/demo-DkPrBTlC.js"></script>
    <link rel="stylesheet" crossorigin href="/demo/assets/demo-B5CBFgB_.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
